{% extends 'base.html' %}

{% block title %}Reset password | SurveySolver{% endblock %}

{% block content %}
<section aria-labelledby="reset-heading">
    <h1 id="reset-heading">Reset your password</h1>
    <p>Enter your verified email address and we will send reset instructions.</p>
    <form method="post" action="{% url 'account_reset_password' %}">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit">Send reset link</button>
    </form>
</section>
{% endblock %}
